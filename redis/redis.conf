# Redis configuration for KubeStellar UI

# Basic settings
bind 0.0.0.0
port 6379
protected-mode no

# Persistence
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# Memory management
maxmemory 256mb
maxmemory-policy allkeys-lru

# Logging
loglevel notice
logfile ""

# Timeouts
timeout 0
tcp-keepalive 300

# Performance
databases 16
